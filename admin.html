<script>

/* =====================================================

===================================================== */

const SUPABASE_URL =
"https://rbgqqtayaexgyhozufpg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_FC5-3_O-bJ6oQKt3SESRlg_TUeT70cl";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   STORAGE BUCKET
===================================================== */

const STORAGE_BUCKET =
"Product-images";


/* =====================================================
   ELEMENTS
===================================================== */

const loginPage =
document.getElementById("loginPage");

const adminPage =
document.getElementById("adminPage");

const loginForm =
document.getElementById("loginForm");

const loginMessage =
document.getElementById("loginMessage");

const productForm =
document.getElementById("productForm");

const productName =
document.getElementById("productName");

const productPrice =
document.getElementById("productPrice");

const productCategory =
document.getElementById("productCategory");

const productDescription =
document.getElementById("productDescription");

const productImage =
document.getElementById("productImage");

const imagePreview =
document.getElementById("imagePreview");

const adminProducts =
document.getElementById("adminProducts");

const adminStatus =
document.getElementById("adminStatus");

const formTitle =
document.getElementById("formTitle");

const saveButton =
document.getElementById("saveButton");

const cancelButton =
document.getElementById("cancelButton");


let products = [];

let editingProductId = null;

let editingOldImage = null;


/* =====================================================
   STATUS
===================================================== */

function showStatus(message,type){

  adminStatus.textContent = message;

  adminStatus.className = "";

  if(type === "success"){

    adminStatus.classList.add(
      "status-success"
    );

  }

  else if(type === "error"){

    adminStatus.classList.add(
      "status-error"
    );

  }

  else{

    adminStatus.classList.add(
      "status-loading"
    );

  }

}

function hideStatus(){

  adminStatus.className = "";

  adminStatus.style.display = "none";

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    const email =
      document
      .getElementById("loginEmail")
      .value
      .trim();

    const password =
      document
      .getElementById("loginPassword")
      .value;

    loginMessage.textContent =
      "Logging in...";

    loginMessage.style.color =
      "#2563eb";


    const {
      data,
      error
    } =
    await supabaseClient.auth.signInWithPassword({

      email:email,

      password:password

    });


    if(error){

      console.error(error);

      loginMessage.textContent =
        "Login failed: " +
        error.message;

      loginMessage.style.color =
        "#dc2626";

      return;

    }


    if(!data.session){

      loginMessage.textContent =
        "Login failed. No session created.";

      loginMessage.style.color =
        "#dc2626";

      return;

    }


    loginPage.style.display =
      "none";

    adminPage.style.display =
      "block";

    loadProducts();

  }
);


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();


  if(
    !error &&
    data &&
    data.session
  ){

    loginPage.style.display =
      "none";

    adminPage.style.display =
      "block";

    loadProducts();

  }

  else{

    loginPage.style.display =
      "flex";

    adminPage.style.display =
      "none";

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  adminPage.style.display =
    "none";

  loginPage.style.display =
    "flex";

  loginForm.reset();

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

  adminProducts.innerHTML =
  `
  <div class="empty">
    Loading services...
  </div>
  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("products")
    .select("*")
    .order("id",{
      ascending:false
    });


  if(error){

    console.error(
      "LOAD PRODUCTS ERROR:",
      error
    );


    showStatus(
      "Could not load services: " +
      error.message,
      "error"
    );


    adminProducts.innerHTML =
    `
    <div class="empty">
      ❌ Could not load services.
    </div>
    `;

    return;

  }


  products =
    data || [];

  hideStatus();

  displayAdminProducts();

}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayAdminProducts(){

  adminProducts.innerHTML =
    "";


  if(!products.length){

    adminProducts.innerHTML =
    `
    <div class="empty">

      📦 No services yet.

      <br><br>

      Add your first printing service
      using the form.

    </div>
    `;

    return;

  }


  products.forEach(
    function(product){

      const card =
        document.createElement("div");

      card.className =
        "product-card";


      const image =
        document.createElement("div");

      image.className =
        "product-image";


      if(product.image){

        const img =
          document.createElement("img");

        img.src =
          product.image;

        img.alt =
          product.name ||
          "Service";


        img.onerror =
          function(){

            image.innerHTML =
              "🖨️";

          };


        image.appendChild(img);

      }

      else{

        image.textContent =
          "🖨️";

      }


      const info =
        document.createElement("div");

      info.className =
        "product-info";


      const name =
        document.createElement("h3");

      name.textContent =
        product.name ||
        "Unnamed Service";


      const category =
        document.createElement("div");

      category.className =
        "product-category";

      category.textContent =
        product.category ||
        "Printing";


      const price =
        document.createElement("div");

      price.className =
        "product-price";

      price.textContent =
        "KSh " +
        Number(
          product.price || 0
        ).toLocaleString();


      const description =
        document.createElement("div");

      description.className =
        "product-description";

      description.textContent =
        product.description ||
        "No description";


      const buttons =
        document.createElement("div");

      buttons.className =
        "action-buttons";


      const editButton =
        document.createElement("button");

      editButton.className =
        "edit-btn";

      editButton.textContent =
        "✏️ Edit";


      editButton.onclick =
        function(){

          editProduct(product);

        };


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-btn";

      deleteButton.textContent =
        "🗑️ Delete";


      deleteButton.onclick =
        function(){

          deleteProduct(product);

        };


      buttons.appendChild(
        editButton
      );

      buttons.appendChild(
        deleteButton
      );


      info.appendChild(name);

      info.appendChild(category);

      info.appendChild(price);

      info.appendChild(description);

      info.appendChild(buttons);


      card.appendChild(image);

      card.appendChild(info);


      adminProducts.appendChild(card);

    }
  );

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

productImage.addEventListener(
  "change",
  function(){

    const file =
      productImage.files[0];


    if(!file){

      if(editingOldImage){

        imagePreview.innerHTML =
        `
        <img
          src="${editingOldImage}"
          alt="Current image"
        >
        `;

      }

      else{

        imagePreview.innerHTML =
          "📷 Select an image";

      }

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(event){

        imagePreview.innerHTML =
        `
        <img
          src="${event.target.result}"
          alt="Preview"
        >
        `;

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   ADD / UPDATE SERVICE
===================================================== */

productForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const name =
      productName.value.trim();


    const price =
      Number(
        productPrice.value
      );


    const category =
      productCategory.value.trim();


    const description =
      productDescription.value.trim();


    const file =
      productImage.files[0];


    if(!name){

      showStatus(
        "Please enter the service name.",
        "error"
      );

      return;

    }


    if(
      Number.isNaN(price) ||
      price < 0
    ){

      showStatus(
        "Please enter a valid price.",
        "error"
      );

      return;

    }


    if(!category){

      showStatus(
        "Please select a category.",
        "error"
      );

      return;

    }


    saveButton.disabled =
      true;


    saveButton.textContent =
      editingProductId
      ? "Updating..."
      : "Saving...";


    try{

      let imageUrl =
        editingOldImage ||
        null;


      /* =================================================
         IMAGE UPLOAD
      ================================================= */

      if(file){

        showStatus(
          "Uploading image...",
          "loading"
        );


        const fileExtension =
          file.name
          .split(".")
          .pop()
          .toLowerCase();


        const safeName =
          name
          .toLowerCase()
          .replace(
            /[^a-z0-9]+/g,
            "-"
          )
          .replace(
            /^-+|-+$/g,
            "");


        const filePath =
          Date.now() +
          "-" +
          safeName +
          "." +
          fileExtension;


        const {
          error: uploadError
        } =
        await supabaseClient
          .storage
          .from(STORAGE_BUCKET)
          .upload(
            filePath,
            file,
            {
              cacheControl:"3600",
              upsert:false
            }
          );


        if(uploadError){

          throw new Error(
            "Image upload failed: " +
            uploadError.message
          );

        }


        const {
          data: publicData
        } =
        supabaseClient
          .storage
          .from(STORAGE_BUCKET)
          .getPublicUrl(
            filePath
          );


        imageUrl =
          publicData.publicUrl;

      }


      /* =================================================
         UPDATE
      ================================================= */

      if(editingProductId){

        showStatus(
          "Updating service...",
          "loading"
        );


        const {
          error
        } =
        await supabaseClient
          .from("products")
          .update({

            name:name,

            price:price,

            category:category,

            description:description,

            image:imageUrl

          })
          .eq(
            "id",
            editingProductId
          );


        if(error){

          throw new Error(
            "Service update failed: " +
            error.message
          );

        }


        showStatus(
          "✅ Service updated successfully.",
          "success"
        );

      }


      /* =================================================
         INSERT
      ================================================= */

      else{

        showStatus(
          "Saving service...",
          "loading"
        );


        const {
          error
        } =
        await supabaseClient
          .from("products")
          .insert({

            name:name,

            price:price,

            category:category,

            description:description,

            image:imageUrl

          });


        if(error){

          throw new Error(
            "Service save failed: " +
            error.message
          );

        }


        showStatus(
          "✅ Service added successfully.",
          "success"
        );

      }


      resetProductForm();

      await loadProducts();

    }


    catch(error){

      console.error(
        "SERVICE SAVE ERROR:",
        error
      );


      showStatus(
        error.message ||
        "Something went wrong.",
        "error"
      );

    }


    saveButton.disabled =
      false;


    saveButton.textContent =
      editingProductId
      ? "💾 Update Service"
      : "💾 Save Service";

  }
);


/* =====================================================
   EDIT SERVICE
===================================================== */

function editProduct(product){

  editingProductId =
    product.id;


  editingOldImage =
    product.image ||
    null;


  formTitle.textContent =
    "✏️ Edit Service";


  productName.value =
    product.name ||
    "";


  productPrice.value =
    product.price ||
    "";


  productCategory.value =
    product.category ||
    "";


  productDescription.value =
    product.description ||
    "";


  productImage.value =
    "";


  if(product.image){

    imagePreview.innerHTML =
    `
    <img
      src="${product.image}"
      alt="Current service image"
    >
    `;

  }

  else{

    imagePreview.innerHTML =
      "📷 No current image";

  }


  saveButton.textContent =
    "💾 Update Service";


  cancelButton.style.display =
    "block";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit(){

  resetProductForm();

  hideStatus();

}


/* =====================================================
   RESET FORM
===================================================== */

function resetProductForm(){

  productForm.reset();


  editingProductId =
    null;


  editingOldImage =
    null;


  formTitle.textContent =
    "➕ Add Service";


  saveButton.textContent =
    "💾 Save Service";


  cancelButton.style.display =
    "none";


  imagePreview.innerHTML =
    "📷 Select an image";

}


/* =====================================================
   DELETE SERVICE
===================================================== */

async function deleteProduct(product){

  const confirmed =
    confirm(
      "Are you sure you want to delete \"" +
      product.name +
      "\"?"
    );


  if(!confirmed){

    return;

  }


  showStatus(
    "Deleting service...",
    "loading"
  );


  const {
    error
  } =
  await supabaseClient
    .from("products")
    .delete()
    .eq(
      "id",
      product.id
    );


  if(error){

    console.error(
      "DELETE ERROR:",
      error
    );


    showStatus(
      "Could not delete service: " +
      error.message,
      "error"
    );

    return;

  }


  showStatus(
    "✅ Service deleted successfully.",
    "success"
  );


  await loadProducts();

}


/* =====================================================
   OPEN MAIN WEBSITE
===================================================== */

function openWebsite(){

  window.location.href =
    "index.html";

}


/* =====================================================
   START
